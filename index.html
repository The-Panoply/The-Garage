<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kyle's Garage</title><style>body{margin:0;background:#fff;color:#202b38;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{margin:0 0 4px}p{color:#59697a}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,input{font:inherit;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#243447;padding:10px;cursor:pointer}button.active{background:#244d76;color:#fff;border-color:#244d76}input{width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse;min-width:810px;table-layout:auto}thead th:nth-child(3),tbody td:nth-child(3){width:48%;min-width:350px}thead th:nth-child(n+4),tbody td:nth-child(n+4){width:11%;white-space:nowrap}thead th:nth-child(n+4) button{gap:3px;font-size:12px}thead th:nth-child(n+4) .sort-icon{margin-left:0}thead th:nth-child(4),tbody td:nth-child(4){text-align:center}thead th:nth-child(4) button{justify-content:center}th,td{border-bottom:1px solid #e2e6eb;padding:10px 6px;text-align:left}thead{background:#f1f3f6}thead th{border-top:1px solid #e2e6eb;border-bottom:1px solid #d4dce5}tbody tr:hover{background:#fafbfc}th button{border:0;background:transparent;color:#35465b;padding:8px 4px;font-weight:650;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;letter-spacing:.01em}th button:hover{color:#1e5a91}th button:focus-visible{outline:2px solid #3274b6;outline-offset:3px}.sort-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;color:#9ba9b8;transition:color .15s,background .15s}.sort-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}th button.sorted .sort-icon{color:#1e5a91;background:#e6f0fa}td button{border:0;background:none}.vehicle-cell{display:grid;grid-template-columns:34px minmax(170px,1fr) 104px;align-items:center;column-gap:10px;min-width:350px}.vehicle-name-wrap{min-width:0}.vehicle-name-wrap button{display:block;width:100%;padding:0;margin:0;white-space:normal;text-align:left;font-weight:650;line-height:1.35}.vehicle-name-wrap .muted{display:block;margin-top:4px;padding:0;text-align:left;line-height:1.35}.vehicle-brand-slot{width:34px;height:34px;display:flex;align-items:center;justify-content:center}.vehicle-photo-slot{width:104px;min-height:65px;display:flex;align-items:center;justify-content:center}.vehicle-brand{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;background:transparent;border:0;overflow:visible}.vehicle-brand img{width:100%;height:100%;object-fit:contain;aspect-ratio:1/1;padding:2px;box-sizing:border-box}.vehicle-brand-slot{aspect-ratio:1/1}.vehicle-photo,.vehicle-photo-slot a,.vehicle-photo-wrap{width:104px;height:65px;aspect-ratio:8/5;box-sizing:border-box}.vehicle-photo{display:block;object-fit:cover;object-position:center}.vehicle-photo-slot{align-self:center}.vehicle-photo-slot a{display:block;width:104px;height:65px}.vehicle-name-wrap{flex:1;min-width:0}.vehicle-photo{width:104px;height:65px;flex:none;object-fit:cover;border-radius:8px;border:1px solid #e1e5ea;background:#f6f7f8}.vehicle-photo-label{font-size:10px;color:#65768a;margin-top:3px;text-align:right} .scroll{overflow:auto}.star{color:#f7c969;font-size:22px}.muted{color:#68788a;font-size:13px}.detail{background:#f5f7f9;padding:15px}.filter-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:18px 0 12px;min-height:44px}.favorites-toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-weight:600;color:#35465b;white-space:nowrap}.favorites-toggle input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}.toggle-track{position:relative;display:inline-flex;align-items:center;width:42px;height:25px;border-radius:99px;background:#d6dfe8;border:1px solid #bdc9d5;transition:background .18s,border-color .18s;flex:none}.toggle-thumb{position:absolute;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #1b2c3d33;transition:transform .18s}.favorites-toggle input:checked+.toggle-track{background:#244d76;border-color:#244d76}.favorites-toggle input:checked+.toggle-track .toggle-thumb{transform:translateX(17px)}.favorites-toggle input:focus-visible+.toggle-track{outline:3px solid #8cb7e5;outline-offset:3px}.favorites-label{display:inline-flex;align-items:center;gap:6px}.favorites-star{color:#c39238;font-size:17px}.vehicle-count{margin-left:auto;text-align:right;color:#66778a;font-size:13px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}@media(max-width:420px){.filter-bar{gap:8px}.favorites-toggle{font-size:14px}.vehicle-count{font-size:12px}}</style></head><body><main><h1>Kyle's Garage</h1><p>Vehicle comparison · provisional dimensions · local favorites</p><div class="controls" id="tabs"></div><input id="search" placeholder="Search vehicles"><div class="filter-bar"><label class="favorites-toggle" for="favonly"><input id="favonly" type="checkbox"><span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span><span class="favorites-label"><span class="favorites-star" aria-hidden="true">★</span> Favorites only</span></label><span id="count" class="vehicle-count" aria-live="polite"></span></div><div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><p>Measurements are preliminary and should be verified against official model-year specifications. Favorites are saved only in this browser and are not synchronized.</p></main><script>
const cars=[{"id":1,"name":"Porsche Taycan","category":"Sedans","legroom":null,"length":195.4,"width":77.4,"height":54.3},{"id":2,"name":"Porsche 911","category":"Sports & GTs","legroom":null,"length":179,"width":72.9,"height":51.3},{"id":3,"name":"BMW M5","category":"Sedans","legroom":41.3,"length":200.6,"width":77.6,"height":59.4},{"id":4,"name":"Ford F-250 / F-350","category":"SUVs & Trucks","legroom":43.9,"length":null,"width":80,"height":null},{"id":5,"name":"Chevrolet Silverado / GMC Sierra 2500HD / 3500HD","category":"SUVs & Trucks","legroom":44.5,"length":null,"width":81.9,"height":null},{"id":6,"name":"BMW 7 Series (2025+)","category":"Sedans","legroom":41.2,"length":212.2,"width":76.8,"height":60.8},{"id":7,"name":"BMW M3 (next generation)","category":"Sedans","legroom":null,"length":null,"width":null,"height":null},{"id":8,"name":"Scout Terra","category":"SUVs & Trucks","legroom":null,"length":229,"width":79.9,"height":77.7},{"id":9,"name":"BMW X7 (2019)","category":"SUVs & Trucks","legroom":39.8,"length":203.3,"width":78.7,"height":71.1},{"id":10,"name":"BMW X5 (2027)","category":"SUVs & Trucks","legroom":null,"length":null,"width":null,"height":null},{"id":11,"name":"Mercedes-AMG S 63 E Performance","category":"Sedans","legroom":41.4,"length":210.1,"width":75.6,"height":59.2},{"id":12,"name":"Porsche Cayenne Electric","category":"SUVs & Trucks","legroom":null,"length":196.3,"width":78,"height":65.9},{"id":13,"name":"Lucid Gravity","category":"SUVs & Trucks","legroom":40.9,"length":198.2,"width":78.7,"height":65.2},{"id":14,"name":"Cadillac Escalade IQ","category":"SUVs & Trucks","legroom":45.2,"length":224.3,"width":82.4,"height":76.1},{"id":15,"name":"Rolls-Royce Cullinan","category":"SUVs & Trucks","legroom":null,"length":210,"width":79,"height":72},{"id":16,"name":"Lamborghini Urus","category":"SUVs & Trucks","legroom":null,"length":201.3,"width":79.6,"height":64.5},{"id":17,"name":"BMW iX3 (2027)","category":"SUVs & Trucks","legroom":null,"length":188.3,"width":74.6,"height":64.8},{"id":18,"name":"Scout Traveler","category":"SUVs & Trucks","legroom":null,"length":208,"width":79.9,"height":76.3},{"id":19,"name":"BMW i3 (2027, Neue Klasse)","category":"Sedans","legroom":null,"length":null,"width":null,"height":null},{"id":20,"name":"Bentley Torcal","category":"SUVs & Trucks","legroom":null,"length":null,"width":null,"height":null},{"id":21,"name":"Jaguar Type 01","category":"Sedans","legroom":null,"length":null,"width":null,"height":null},{"id":22,"name":"Upcoming Range Rover GT","category":"SUVs & Trucks","legroom":null,"length":null,"width":null,"height":null},{"id":23,"name":"Aston Martin Vantage (2025+)","category":"Sports & GTs","legroom":42.3,"length":null,"width":null,"height":null},{"id":24,"name":"Ferrari Roma","category":"Sports & GTs","legroom":null,"length":null,"width":null,"height":null}];
const KEY="garage-local-stars-v1";let fav;try{fav=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){fav=new Set()}
let category="All",sort="id",asc=true,expanded=new Set(),q="",only=false;
const tabs=["All","SUVs & Trucks","Sedans","Sports & GTs"],cols=[["id","#"],["name","Vehicle"],["legroom","Front legroom"],["length","Length"],["width","Width"],["height","Height"]];
const fmt=x=>x==null?"TBD":x.toFixed(1)+'″';
const demoPhotos={"1":["2024 Porsche Taycan.jpg","Chanokchon","https://commons.wikimedia.org/wiki/File:2024_Porsche_Taycan.jpg"],"3":["BMW M5 (G90) IMG 3266.jpg","Alexander Migl","https://commons.wikimedia.org/wiki/File:BMW_M5_(G90)_IMG_3266.jpg"],"9":["2019 BMW X7 xDrive40i in white, front left.jpg","Mr.choppers","https://commons.wikimedia.org/wiki/File:2019_BMW_X7_xDrive40i_in_white%2C_front_left.jpg"],"13":["Lucid gravity.jpg","Joseph Zadeh","https://commons.wikimedia.org/wiki/File:Lucid_gravity.jpg"],"14":["Cadillac Escalade IQ 001.jpg","JustAnotherCarDesigner","https://commons.wikimedia.org/wiki/File:Cadillac_Escalade_IQ_001.jpg"],"15":["2025 Rolls-Royce Cullinan Series II - 02.jpg","Oleg Yunakov","https://commons.wikimedia.org/wiki/File:2025_Rolls-Royce_Cullinan_Series_II_-_02.jpg"],"16":["Lamborghini Urus SE 2025.jpg","Calreyn88","https://commons.wikimedia.org/wiki/File:Lamborghini_Urus_SE_2025.jpg"],"23":["2025 Aston Martin Vantage V8 2.jpg","Calreyn88","https://commons.wikimedia.org/wiki/File:2025_Aston_Martin_Vantage_V8_2.jpg"],"24":["Ferrari Roma (2022) front.jpg","Charles","https://commons.wikimedia.org/wiki/File:Ferrari_Roma_(2022)_front.jpg"]};const brandIcons={"1":["porsche","porsche.com"],"2":["porsche","porsche.com"],"3":["bmw","bmw.com"],"4":["ford","ford.com"],"5":["chevrolet","chevrolet.com"],"6":["bmw","bmw.com"],"7":["bmw","bmw.com"],"8":["scoutmotors","scoutmotors.com"],"9":["bmw","bmw.com"],"10":["bmw","bmw.com"],"11":["mercedes","mercedes-benz.com"],"12":["porsche","porsche.com"],"13":["lucid","lucidmotors.com"],"14":["cadillac","cadillac.com"],"15":["rollsroyce","rolls-roycemotorcars.com"],"16":["lamborghini","lamborghini.com"],"17":["bmw","bmw.com"],"18":["scoutmotors","scoutmotors.com"],"19":["bmw","bmw.com"],"20":["bentley","bentleymotors.com"],"21":["jaguar","jaguar.com"],"22":["landrover","landrover.com"],"23":["astonmartin","astonmartin.com"],"24":["ferrari","ferrari.com"]};const logoAliases={ford:"ford",mercedes:"mercedes",rollsroyce:"rollsroyce",landrover:"landrover",astonmartin:"astonmartin",scoutmotors:"scout",lucid:"lucidmotors"};const logoURL=id=>{const b=brandIcons[id];return b?"https://cdn.simpleicons.org/"+(logoAliases[b[0]]||b[0])+(b[0]==="ford"?"/003478":"/263747"):""};const photoURL=id=>demoPhotos[id]?"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(demoPhotos[id][0])+"?width=330":"";
function render(){document.getElementById("tabs").innerHTML=tabs.map(t=>'<button data-tab="'+t+'" class="'+(t===category?"active":"")+'">'+(t==="All"?"Master":t)+'</button>').join("");
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{category=b.dataset.tab;render()});
document.getElementById("head").innerHTML='<tr><th>★</th>'+cols.map(([k,n])=>'<th><button data-sort="'+k+'" class="'+(sort===k?"sorted":"")+'" aria-label="Sort by '+n+(sort===k?(asc?', ascending':', descending'):'')+'">'+n+'<span class="sort-icon" aria-hidden="true"><svg viewBox="0 0 16 16">'+(sort===k?(asc?'<path d="M4 10l4-4 4 4"/>':'<path d="M4 6l4 4 4-4"/>'):'<path d="M5 6l3-3 3 3M5 10l3 3 3-3"/>')+'</svg></span></button></th>').join("")+'</tr>';
document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{const k=b.dataset.sort;asc=sort===k?!asc:true;sort=k;render()});
const arr=cars.filter(c=>(category==="All"||c.category===category)&&c.name.toLowerCase().includes(q)&&(!only||fav.has(c.id))).sort((a,b)=>{let x=a[sort],y=b[sort];if(x==null)return y==null?a.id-b.id:1;if(y==null)return -1;return ((typeof x==="string"?x.localeCompare(y):x-y)*(asc?1:-1))||a.id-b.id});
document.getElementById("count").textContent=arr.length+" of "+cars.length+" vehicles";
document.getElementById("body").innerHTML=arr.map(c=>'<tr><td><button class="star" data-star="'+c.id+'">'+(fav.has(c.id)?"★":"☆")+'</button></td><td>'+c.id+'</td><td><div class="vehicle-cell"><span class="vehicle-brand-slot">'+(brandIcons[c.id]?'<span class="vehicle-brand"><img src="'+logoURL(c.id)+'" alt="'+c.name.split(" ")[0]+' manufacturer emblem" loading="lazy" onerror="this.style.visibility=\'hidden\'"></span>':'')+'</span><div class="vehicle-name-wrap"><button data-expand="'+c.id+'">'+(expanded.has(c.id)?"▾ ":"▸ ")+c.name+'</button><div class="muted">'+c.category+'</div></div><span class="vehicle-photo-slot">'+(demoPhotos[c.id]?'<a href="'+demoPhotos[c.id][2]+'" target="_blank" rel="noopener" title="Photo by '+demoPhotos[c.id][1]+' · CC BY-SA 4.0"><img class="vehicle-photo" src="'+photoURL(c.id)+'" alt="'+c.name+' photograph" loading="lazy"></a>':c.id===7?'<div class="vehicle-photo-wrap"><img class="vehicle-photo" src="https://cdn.bmwblog.com/wp-content/uploads/2026/07/BMW-M-Concept-Neue-Klasse-1-1.jpg" alt="Red BMW M concept" loading="lazy"><div class="vehicle-photo-label">Red M concept</div></div>':'')+'</span></div></td>'+["legroom","length","width","height"].map(k=>'<td>'+fmt(c[k])+'</td>').join("")+'</tr>'+(expanded.has(c.id)?'<tr><td colspan="7" class="detail"><strong>'+c.name+'</strong><p>Front legroom: '+fmt(c.legroom)+' · Length: '+fmt(c.length)+' · Width: '+fmt(c.width)+' · Height: '+fmt(c.height)+'</p><span class="muted">Provisional measurements; no personal profile information stored.</span></td></tr>':"")).join("");
document.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{const id=+b.dataset.star;fav.has(id)?fav.delete(id):fav.add(id);try{localStorage.setItem(KEY,JSON.stringify([...fav]))}catch(e){}render()});
document.querySelectorAll("[data-expand]").forEach(b=>b.onclick=()=>{const id=+b.dataset.expand;expanded.has(id)?expanded.delete(id):expanded.add(id);render()})}

</script></body></html>

  mobileSortBar.classList.add("search-open");
  mobileSearchButton.setAttribute("aria-expanded","true");
  mobileSearchButton.setAttribute("aria-label","Close vehicle search");
 }
}
placeSearchField();
phoneLayout.addEventListener("change",placeSearchField);
/* Move existing controls into two phone rows; restore original desktop order. */
const powertrainControls=document.getElementById("powertrain-filters");
const powertrainBar=document.querySelector(".filter-bar");
const dimensionSwitch=powertrainBar.querySelector(".dimension-switch");
const compareToggle=powertrainBar.querySelector(".favorites-toggle");
function placeResponsiveControls(){
 if(phoneLayout.matches){
  mobileTopGrid.append(vehicleToolbar,mobileSortBar,dimensionSwitch);
  mobileSortWithPowertrain.append(compareToggle,powertrainControls);
 }else{
  mobileTopGrid.after(vehicleToolbar);
  mobileSortWithPowertrain.appendChild(mobileSortBar);
  powertrainBar.appendChild(dimensionSwitch);
  powertrainBar.insertBefore(powertrainControls,dimensionSwitch);
  powertrainBar.insertBefore(compareToggle,powertrainControls);
 }
 alignPowertrainFilters();
 alignPowertrainRowIcons();
 sizeMobileSort();
 alignCompareStar();
}
placeResponsiveControls();
phoneLayout.addEventListener("change",placeResponsiveControls);
function toggleMobileSearch(forceOpen){
 const open=typeof forceOpen==="boolean"?forceOpen:!mobileSortBar.classList.contains("search-open");
 mobileSortBar.classList.toggle("search-open",open);
 mobileSearchButton.setAttribute("aria-expanded",String(open));
 mobileSearchButton.setAttribute("aria-label",open?"Close vehicle search":"Show vehicle search");
 if(open){searchField.focus()}else{if(searchField.value){searchField.value="";q="";render()}mobileSearchButton.focus()}
}
mobileSearchButton.onclick=()=>toggleMobileSearch();
searchField.addEventListener("keydown",e=>{if(e.key==="Escape"&&window.matchMedia("(max-width:650px)").matches){e.preventDefault();toggleMobileSearch(false)}});
searchField.oninput=e=>{q=e.target.value.toLowerCase();render()};document.getElementById("favonly").onchange=e=>{only=e.target.checked;render()};document.querySelectorAll("[data-dim-mode]").forEach(button=>button.onclick=()=>{const next=button.dataset.dimMode;if(next===dimensionMode)return;dimensionMode=next;if(sort!=="id"&&sort!=="name"&&!dimensionCols[next].some(([key])=>key===sort)){sort="id";asc=true}render()});render();

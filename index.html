<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kyle's Garage</title><style>body{margin:0;background:#fff;color:#202b38;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{margin:0 0 4px}p{color:#59697a}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,input{font:inherit;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#243447;padding:10px;cursor:pointer}button.active{background:#244d76;color:#fff;border-color:#244d76}input{width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse;min-width:720px}th,td{border-bottom:1px solid #e2e6eb;padding:12px 10px;text-align:left}thead{background:#f1f3f6}thead th{border-top:1px solid #e2e6eb;border-bottom:1px solid #d4dce5}tbody tr:hover{background:#fafbfc}th button{border:0;background:transparent;color:#35465b;padding:8px 4px;font-weight:650;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;letter-spacing:.01em}th button:hover{color:#1e5a91}th button:focus-visible{outline:2px solid #3274b6;outline-offset:3px}.sort-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;color:#9ba9b8;transition:color .15s,background .15s}.sort-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}th button.sorted .sort-icon{color:#1e5a91;background:#e6f0fa}td button{border:0;background:none} .scroll{overflow:auto}.star{color:#f7c969;font-size:22px}.muted{color:#68788a;font-size:13px}.detail{background:#f5f7f9;padding:15px}.filter-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:18px 0 12px;min-height:44px}.favorites-toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-weight:600;color:#35465b;white-space:nowrap}.favorites-toggle input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}.toggle-track{position:relative;display:inline-flex;align-items:center;width:42px;height:25px;border-radius:99px;background:#d6dfe8;border:1px solid #bdc9d5;transition:background .18s,border-color .18s;flex:none}.toggle-thumb{position:absolute;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #1b2c3d33;transition:transform .18s}.favorites-toggle input:checked+.toggle-track{background:#244d76;border-color:#244d76}.favorites-toggle input:checked+.toggle-track .toggle-thumb{transform:translateX(17px)}.favorites-toggle input:focus-visible+.toggle-track{outline:3px solid #8cb7e5;outline-offset:3px}.favorites-label{display:inline-flex;align-items:center;gap:6px}.favorites-star{color:#c39238;font-size:17px}.vehicle-count{margin-left:auto;text-align:right;color:#66778a;font-size:13px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}@media(max-width:420px){.filter-bar{gap:8px}.favorites-toggle{font-size:14px}.vehicle-count{font-size:12px}}</style></head><body><main><h1>Kyle's Garage</h1><p>Vehicle comparison · provisional dimensions · local favorites</p><div class="controls" id="tabs"></div><input id="search" placeholder="Search vehicles"><div class="filter-bar"><label class="favorites-toggle" for="favonly"><input id="favonly" type="checkbox"><span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span><span class="favorites-label"><span class="favorites-star" aria-hidden="true">★</span> Favorites only</span></label><span id="count" class="vehicle-count" aria-live="polite"></span></div><div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><p>Measurements are preliminary and should be verified against official model-year specifications. Favorites are saved only in this browser and are not synchronized.</p></main><script>
const cars=[{"id":1,"name":"Porsche Taycan","category":"Sedans","legroom":null,"length":195.4,"width":77.4,"height":54.3},{"id":2,"name":"Porsche 911","category":"Sports & GTs","legroom":null,"length":179,"width":72.9,"height":51.3},{"id":3,"name":"BMW M5","category":"Sedans","legroom":41.3,"length":200.6,"width":77.6,"height":59.4},{"id":4,"name":"Ford F-250 / F-350","category":"SUVs & Trucks","legroom":43.9,"length":null,"width":80,"height":null},{"id":5,"name":"Chevrolet Silverado / GMC Sierra 2500HD / 3500HD","category":"SUVs & Trucks","legroom":44.5,"length":null,"width":81.9,"height":null},{"id":6,"name":"BMW 7 Series (2025+)","category":"Sedans","legroom":41.2,"length":212.2,"width":76.8,"height":60.8},{"id":7,"name":"BMW M3 (next generation)","category":"Sedans","legroom":null,"length":null,"width":null,"height":null},{"id":8,"name":"Scout Terra","category":"SUVs & Trucks","legroom":null,"length":229,"width":79.9,"height":77.7},{"id":9,"name":"BMW X7 (2019)","category":"SUVs & Trucks","legroom":39.8,"length":203.3,"width":78.7,"height":71.1},{"id":10,"name":"BMW X5 (2027)","category":"SUVs & Trucks","legroom":null,"length":null,"width":null,"height":null},{"id":11,"name":"Mercedes-AMG S 63 E Performance","category":"Sedans","legroom":41.4,"length":210.1,"width":75.6,"height":59.2},{"id":12,"name":"Porsche Cayenne Electric","category":"SUVs & Trucks","legroom":null,"length":196.3,"width":78,"height":65.9},{"id":13,"name":"Lucid Gravity","category":"SUVs & Trucks","legroom":40.9,"length":198.2,"width":78.7,"height":65.2},{"id":14,"name":"Cadillac Escalade IQ","category":"SUVs & Trucks","legroom":45.2,"length":224.3,"width":82.4,"height":76.1},{"id":15,"name":"Rolls-Royce Cullinan","category":"SUVs & Trucks","legroom":null,"length":210,"width":79,"height":72},{"id":16,"name":"Lamborghini Urus","category":"SUVs & Trucks","legroom":null,"length":201.3,"width":79.6,"height":64.5},{"id":17,"name":"BMW iX3 (2027)","category":"SUVs & Trucks","legroom":null,"length":188.3,"width":74.6,"height":64.8},{"id":18,"name":"Scout Traveler","category":"SUVs & Trucks","legroom":null,"length":208,"width":79.9,"height":76.3},{"id":19,"name":"BMW i3 (2027, Neue Klasse)","category":"Sedans","legroom":null,"length":null,"width":null,"height":null},{"id":20,"name":"Bentley Torcal","category":"SUVs & Trucks","legroom":null,"length":null,"width":null,"height":null},{"id":21,"name":"Jaguar Type 01","category":"Sports & GTs","legroom":null,"length":null,"width":null,"height":null},{"id":22,"name":"Upcoming Range Rover GT","category":"SUVs & Trucks","legroom":null,"length":null,"width":null,"height":null},{"id":23,"name":"Aston Martin Vantage (2025+)","category":"Sports & GTs","legroom":42.3,"length":null,"width":null,"height":null},{"id":24,"name":"Ferrari Roma","category":"Sports & GTs","legroom":null,"length":null,"width":null,"height":null}];
const KEY="garage-local-stars-v1";let fav;try{fav=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){fav=new Set()}
let category="All",sort="id",asc=true,expanded=new Set(),q="",only=false;
const tabs=["All","SUVs & Trucks","Sedans","Sports & GTs"],cols=[["id","#"],["name","Vehicle"],["legroom","Front legroom"],["length","Length"],["width","Width"],["height","Height"]];
const fmt=x=>x==null?"TBD":x.toFixed(1)+'″';
function render(){document.getElementById("tabs").innerHTML=tabs.map(t=>'<button data-tab="'+t+'" class="'+(t===category?"active":"")+'">'+(t==="All"?"Master":t)+'</button>').join("");
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{category=b.dataset.tab;render()});
document.getElementById("head").innerHTML='<tr><th>★</th>'+cols.map(([k,n])=>'<th><button data-sort="'+k+'" class="'+(sort===k?"sorted":"")+'" aria-label="Sort by '+n+(sort===k?(asc?', ascending':', descending'):'')+'">'+n+'<span class="sort-icon" aria-hidden="true"><svg viewBox="0 0 16 16">'+(sort===k?(asc?'<path d="M4 10l4-4 4 4"/>':'<path d="M4 6l4 4 4-4"/>'):'<path d="M5 6l3-3 3 3M5 10l3 3 3-3"/>')+'</svg></span></button></th>').join("")+'</tr>';
document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{const k=b.dataset.sort;asc=sort===k?!asc:true;sort=k;render()});
const arr=cars.filter(c=>(category==="All"||c.category===category)&&c.name.toLowerCase().includes(q)&&(!only||fav.has(c.id))).sort((a,b)=>{let x=a[sort],y=b[sort];if(x==null)return y==null?a.id-b.id:1;if(y==null)return -1;return ((typeof x==="string"?x.localeCompare(y):x-y)*(asc?1:-1))||a.id-b.id});
document.getElementById("count").textContent=arr.length+" of "+cars.length+" vehicles";
document.getElementById("body").innerHTML=arr.map(c=>'<tr><td><button class="star" data-star="'+c.id+'">'+(fav.has(c.id)?"★":"☆")+'</button></td><td>'+c.id+'</td><td><button data-expand="'+c.id+'">'+(expanded.has(c.id)?"▾ ":"▸ ")+c.name+'</button><div class="muted">'+c.category+'</div></td>'+["legroom","length","width","height"].map(k=>'<td>'+fmt(c[k])+'</td>').join("")+'</tr>'+(expanded.has(c.id)?'<tr><td colspan="7" class="detail"><strong>'+c.name+'</strong><p>Front legroom: '+fmt(c.legroom)+' · Length: '+fmt(c.length)+' · Width: '+fmt(c.width)+' · Height: '+fmt(c.height)+'</p><span class="muted">Provisional measurements; no personal profile information stored.</span></td></tr>':"")).join("");
document.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{const id=+b.dataset.star;fav.has(id)?fav.delete(id):fav.add(id);try{localStorage.setItem(KEY,JSON.stringify([...fav]))}catch(e){}render()});
document.querySelectorAll("[data-expand]").forEach(b=>b.onclick=()=>{const id=+b.dataset.expand;expanded.has(id)?expanded.delete(id):expanded.add(id);render()})}
document.getElementById("search").oninput=e=>{q=e.target.value.toLowerCase();render()};document.getElementById("favonly").onchange=e=>{only=e.target.checked;render()};render();
</script></body></html>
